version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      nuget:
        patterns:
          - "*"
    # The app targets .NET 10; a major EF Core / Identity bump needs the TFM
    # and the whole stack to move together, so handle those manually.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      docker:
        patterns:
          - "*"
    # Do not jump the SDK/runtime base images to a new major .NET line.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
